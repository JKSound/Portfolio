<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — Jonas Krogh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAE0CC;
    --paper-light: #F6F0E3;
    --paper-deep: #DED2B7;
    --ink: #2A2019;
    --ink-soft: #6B5D4C;
    --rust: #A8472C;
    --rust-deep: #8A3A23;
    --ochre: #BE8A34;
    --pine: #33473B;
    --line: rgba(42, 32, 25, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(rgba(42,32,25,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  a { color: inherit; }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 32px;
  }

  header.site-nav {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(234, 224, 204, 0.88);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .site-nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
    padding-bottom: 18px;
    max-width: 780px;
  }
  .site-nav .mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
  }
  .site-nav .mark em { color: var(--rust); font-style: italic; }
  .back-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: var(--ink-soft);
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .back-link:hover, .back-link:focus-visible { color: var(--rust); border-color: var(--rust); }

  .cv-hero { padding: 64px 0 40px; }
  .cv-hero .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rust);
    margin: 0 0 16px;
  }
  .cv-hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }
  .cv-hero h1 em { font-style: italic; font-weight: 400; color: var(--rust); }

  .spec-line {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    margin-bottom: 8px;
  }
  .spec-line span { padding: 0 16px; border-right: 1px solid var(--line); }
  .spec-line span:last-child { border-right: none; }
  .spec-line span:first-child { padding-left: 0; }
  .spec-line b { color: var(--pine); font-weight: 500; }

  section { padding: 48px 0 72px; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .section-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    margin: 0;
  }
  .section-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.76rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .timeline { position: relative; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 118px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--line);
  }

  .entry {
    display: grid;
    grid-template-columns: 100px 36px 1fr;
    gap: 0;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    align-items: start;
  }
  .entry:last-child { border-bottom: none; }

  .entry .date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.74rem;
    color: var(--ink-soft);
    padding-top: 3px;
    line-height: 1.4;
  }
  .entry .dot-col {
    position: relative;
    display: flex;
    justify-content: center;
  }
  .entry .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-soft);
    margin-top: 7px;
  }

  .entry .content h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.12rem;
    margin: 0 0 3px;
    line-height: 1.3;
  }
  .entry .content .venue {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin: 0 0 8px;
  }

  .seasons {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .season-row {
    display: grid;
    grid-template-columns: 66px 150px 1fr;
    gap: 12px;
    padding: 5px 0;
    align-items: baseline;
  }
  .season-row.new-season {
    margin-top: 10px;
    padding-top: 11px;
    border-top: 1px solid var(--line);
  }
  .season-row:first-child { margin-top: 0; padding-top: 5px; border-top: none; }
  .season-row .period {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--pine);
    letter-spacing: 0.03em;
  }
  .season-row .role {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .season-row .show {
    font-size: 0.88rem;
    font-style: italic;
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .season-row { grid-template-columns: 44px 1fr; row-gap: 2px; }
    .season-row .show { grid-column: 2; }
  }

  .legend {
    display: flex;
    gap: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 28px;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .legend .dot.lyddesign { background: var(--rust); }
  .legend .dot.lydteknik { background: var(--ochre); }

  footer {
    padding: 28px 0 40px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  @media (max-width: 640px) {
    .timeline::before { left: 60px; }
    .entry { grid-template-columns: 60px 24px 1fr; }
    .entry .date { font-size: 0.68rem; }
    .spec-line span { padding: 0 10px; }
  }

  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <div class="mark">Jonas <em>Krogh</em></div>
    <a class="back-link" href="index.html">← Portfolio</a>
  </div>
</header>

<div class="wrap">
  <div class="cv-hero">
    <p class="eyebrow">Curriculum Vitae</p>
    <h1>Fuldt <em>overblik</em> og tidslinje</h1>
    <div class="spec-line">
      <span><b>Base</b> København</span>
      <span><b>Erfaring</b> Siden 2017</span>
      <span><b>Uddannelse</b> Sonic College (2014–2018)</span>
      <span><b>Software</b> Ableton Live, Q.lab, iZotope RX</span>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="section-head">
      <h2>Tidligere projekter</h2>
      <span class="count" id="entry-count"></span>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<footer>
  © 2026 Jonas Krogh — Lyddesign & Komposition til teater
</footer>

<script>
/* Ret eller tilføj opgaver herunder. "tags" styrer prikkens
   farve og de små mærker: brug ["lyddesign"], ["lydteknik"],
   eller begge, alt efter hvad opgaven faktisk indebar. */
const entries = [
  {
    venue: "Østerbro Teater", show: null, role: "Lydtekniker — flere roller pr. sæson, se opgaver nedenfor",
    date: "Jan 2020 – Juni 2026", tags: ["lydteknik", "lyddesign"],
    seasons: [
      { period: "2025–26", items: [
        { role: "Komponist og Lyddesigner", show: "CRIP" },
        { role: "Tonemester", show: "Fuglene" },
        { role: "Tonemester", show: "Moby Dick" }
      ]},
      { period: "2024–25", items: [
        { role: "Lydtekniker", show: "Vi, de druknede" },
        { role: "Tonemester", show: "Fuglene" },
        { role: "Tonemester", show: "Appollonian Circles" },
        { role: "Tonemester", show: "Pow-Pow-Pow" },
        { role: "Tonemester", show: "Anna Karenina" }
      ]},
      { period: "2023–24", items: [
        { role: "Komponist og Lyddesigner", show: "Dagene, dagene, dagene" },
        { role: "Lydtekniker", show: "Grimm" },
        { role: "Teknisk afvikler", show: "En lykkelig slutning" },
        { role: "Lydtekniker", show: "Er det nok nu?" }
      ]},
      { period: "2022–23", items: [
        { role: "Lydtekniker og Teknisk afvikling", show: "Hair" },
        { role: "Lydtekniker og Teknisk afvikling", show: "Gasolin" }
      ]}
    ]
  },
  { venue: "Teater Sort/Hvid", show: "Pigedyr", role: "Lyddesigner", date: "Aug 2023 – Sep 2023", tags: ["lyddesign"] },
  { venue: "Augmented Hearing", show: null, role: "Lydteknisk Konsulent", date: "Maj 2022 – Juni 2022", tags: ["lydteknik"] },
  { venue: "Paolo Nani Teater", show: "Fridas Store Rejse", role: "Lyddesigner", date: "Marts 2022 – Juli 2022", tags: ["lyddesign"] },
  { venue: "MYKA", show: "Natten (Tour)", role: "Tourne tekniker", date: "Sep 2019 – 2023", tags: ["lydteknik"] },
  { venue: "Teater Sort/Hvid", show: "Electronic", role: "Lydtekniker/Lyddesigner", date: "Okt – Dec 2019", tags: ["lydteknik", "lyddesign"] },
  { venue: "Østerbro Teater", show: "Brøgger", role: "Lydtekniker", date: "Aug – Okt 2019", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "Rocky", role: "Lydtekniker", date: "Maj 2019", tags: ["lydteknik"] },
  { venue: "Livingstones Kabinet", show: "RANDOM (Tour)", role: "Lydtekniker", date: "Marts – April 2019", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "Hvis dette er et menneske", role: "Lydtekniker", date: "Marts 2019", tags: ["lydteknik"] },
  { venue: "Den Danske Scenekunstskole", show: "Afgang", role: "Lyddesigner", date: "Feb – Marts 2019", tags: ["lyddesign"] },
  { venue: "Østerbro Teater", show: "Dantes guddommelige Komedie", role: "Teknisk afvikler", date: "Jan – Feb 2019", tags: ["lydteknik"] },
  { venue: "Teater Sort/Hvid", show: "Living Dead", role: "Teknisk afvikler", date: "Okt – Dec 2018", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "Richard III", role: "Lydtekniker/Q.lab koder", date: "Aug – Sep 2018", tags: ["lydteknik"] },
  { venue: "Liminal", show: "Fiaskomonologerne (the movie)", role: "Boomer + Noise Removal", date: "Maj – Juli 2018", tags: ["lydteknik"] },
  { venue: "Sew Funk Fury Wit", show: "Crash", role: "Lyddesign/teknik & teknisk afvikler", date: "Feb – Marts 2018", tags: ["lyddesign", "lydteknik"] },
  { venue: "KoppelWrite", show: "Født igår", role: "Lydtekniker & mix", date: "Sep – Okt 2017", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "STATUS", role: "Teknisk afvikler", date: "April – Juni 2017", tags: ["lydteknik"] },
  { venue: "Livingstones Kabinet", show: "RANDOM", role: "Praktikant/Lyddesigner", date: "Jan 2017 – Marts 2017", tags: ["lyddesign"] }
];

const tagLabels = { lyddesign: "Lyddesign", lydteknik: "Lydteknik" };

const timeline = document.getElementById('timeline');

/* Total antal opsætninger: alle linjer i "entries" tælles som 1,
   bortset fra Østerbro Teater-linjen, hvor hver sæsons enkelte
   opsætninger ("seasons[].items") tælles i stedet for linjen selv. */
const totalOpsaetninger = entries.reduce((sum, e) => {
  if (e.seasons) {
    return sum + e.seasons.reduce((s, season) => s + season.items.length, 0);
  }
  return sum + 1;
}, 0);
document.getElementById('entry-count').textContent = totalOpsaetninger + " projekter";

entries.forEach(e => {
  const row = document.createElement('div');
  row.className = 'entry';

  const titleHtml = e.show ? `${e.venue}: <em style="font-style:italic">${e.show}</em>` : e.venue;

  const seasonsHtml = e.seasons ? `
    <div class="seasons">
      ${e.seasons.map(s => s.items.map((it, idx) => `
        <div class="season-row${idx === 0 ? ' new-season' : ''}">
          <div class="period">${idx === 0 ? s.period : ''}</div>
          <div class="role">${it.role}</div>
          <div class="show">${it.show}</div>
        </div>
      `).join('')).join('')}
    </div>
  ` : '';

  row.innerHTML = `
    <div class="date">${e.date}</div>
    <div class="dot-col"><div class="dot"></div></div>
    <div class="content">
      <h3>${titleHtml}</h3>
      <p class="venue">${e.role}</p>
      ${seasonsHtml}
    </div>
  `;
  timeline.appendChild(row);
});
</script>

</body>
</html>
