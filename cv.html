<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — Jonas Krogh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --paper-light: #F6F0E3;
    --paper-deep: #DED2B7;
    --ink: #2A2019;
    --ink-soft: #6B5D4C;
    --rust: #A8472C;
    --rust-deep: #8A3A23;
    --ochre: #BE8A34;
    --pine: #33473B;
    --line: rgba(42, 32, 25, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(rgba(42,32,25,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  a { color: inherit; }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 32px;
  }

  header.site-nav {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .site-nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
    padding-bottom: 18px;
    max-width: 780px;
  }
  .site-nav .mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
  }
  .site-nav .mark em { color: var(--rust); font-style: italic; }
  .site-nav-right { display: flex; align-items: center; gap: 14px; }
  .back-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: var(--ink-soft);
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .back-link:hover, .back-link:focus-visible { color: var(--rust); border-color: var(--rust); }

  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border-left: 1px solid var(--line);
    padding-left: 14px;
  }
  .lang-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 3px 5px;
  }
  .lang-btn[aria-pressed="true"] { color: var(--rust); font-weight: 600; }
  .lang-btn:hover, .lang-btn:focus-visible { color: var(--rust); }

  .cv-hero { padding: 64px 0 40px; }
  .cv-hero .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rust);
    margin: 0 0 16px;
  }
  .cv-hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }
  .cv-hero h1 em { font-style: italic; font-weight: 400; color: var(--rust); }

  .spec-line {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    margin-bottom: 8px;
  }
  .spec-line span { padding: 0 16px; border-right: 1px solid var(--line); }
  .spec-line span:last-child { border-right: none; }
  .spec-line span:first-child { padding-left: 0; }
  .spec-line b { color: var(--pine); font-weight: 500; }

  section { padding: 48px 0 72px; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .section-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    margin: 0;
  }
  .section-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.76rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .timeline { position: relative; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 118px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--line);
  }

  .entry {
    display: grid;
    grid-template-columns: 100px 36px 1fr;
    gap: 0;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    align-items: start;
  }
  .entry:last-child { border-bottom: none; }

  .entry .date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.74rem;
    color: var(--ink-soft);
    padding-top: 3px;
    line-height: 1.4;
  }
  .entry .dot-col {
    position: relative;
    display: flex;
    justify-content: center;
  }
  .entry .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-soft);
    margin-top: 7px;
  }

  .entry .content h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.12rem;
    margin: 0 0 3px;
    line-height: 1.3;
  }
  .entry .content .venue {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin: 0 0 8px;
  }

  .seasons {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .season-row {
    display: grid;
    grid-template-columns: 66px 150px 1fr;
    gap: 12px;
    padding: 5px 0;
    align-items: baseline;
  }
  .season-row.new-season {
    margin-top: 10px;
    padding-top: 11px;
    border-top: 1px solid var(--line);
  }
  .season-row:first-child { margin-top: 0; padding-top: 5px; border-top: none; }
  .season-row .period {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--pine);
    letter-spacing: 0.03em;
  }
  .season-row .role {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .season-row .show {
    font-size: 0.88rem;
    font-style: italic;
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .season-row { grid-template-columns: 44px 1fr; row-gap: 2px; }
    .season-row .show { grid-column: 2; }
  }

  .legend {
    display: flex;
    gap: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 28px;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .legend .dot.lyddesign { background: var(--rust); }
  .legend .dot.lydteknik { background: var(--ochre); }

  footer {
    padding: 28px 0 40px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  @media (max-width: 640px) {
    .timeline::before { left: 60px; }
    .entry { grid-template-columns: 60px 24px 1fr; }
    .entry .date { font-size: 0.68rem; }
    .spec-line span { padding: 0 10px; }
  }

  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <div class="mark">Jonas <em>Krogh</em></div>
    <div class="site-nav-right">
      <a class="back-link" href="index.html" id="back-link" data-i18n="back">← Portfolio</a>
      <span class="lang-switch">
        <button type="button" id="lang-da" class="lang-btn" aria-pressed="true">DA</button>
        <button type="button" id="lang-en" class="lang-btn" aria-pressed="false">EN</button>
      </span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="cv-hero">
    <p class="eyebrow" data-i18n="eyebrow">Curriculum Vitae</p>
    <h1 data-i18n-html="h1">Fuldt <em>overblik</em> og tidslinje</h1>
    <div class="spec-line">
      <span><b data-i18n="spec.baseLabel">Base</b> <span data-i18n="spec.baseValue">København</span></span>
      <span><b data-i18n="spec.expLabel">Erfaring</b> <span data-i18n="spec.expValue">Siden 2017</span></span>
      <span><b data-i18n="spec.eduLabel">Uddannelse</b> <span data-i18n="spec.eduValue">Sonic College (2014–2018)</span></span>
      <span><b data-i18n="spec.softwareLabel">Software</b> Ableton Live, Q.lab, iZotope RX</span>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="section-head">
      <h2 data-i18n="section.heading">Tidligere projekter</h2>
      <span class="count" id="entry-count"></span>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</section>

<footer data-i18n="footer">
  © 2026 Jonas Krogh — Lyddesign & Komposition
</footer>

<script>
/* ============================================================
   SPROG (DA/EN) — samme princip som på forsiden.
   ============================================================ */
const translations = {
  da: {
    back: '← Portfolio',
    eyebrow: 'Curriculum Vitae',
    h1: 'Fuldt <em>overblik</em> og tidslinje',
    'spec.baseLabel': 'Base',
    'spec.baseValue': 'København',
    'spec.expLabel': 'Erfaring',
    'spec.expValue': 'Siden 2017',
    'spec.eduLabel': 'Uddannelse',
    'spec.eduValue': 'Sonic College (2014–2018)',
    'spec.softwareLabel': 'Software',
    'section.heading': 'Tidligere projekter',
    footer: '© 2026 Jonas Krogh — Lyddesign & Komposition',
    countSuffix: 'projekter'
  },
  en: {
    back: '← Portfolio',
    eyebrow: 'Curriculum Vitae',
    h1: 'Full <em>overview</em> and timeline',
    'spec.baseLabel': 'Based in',
    'spec.baseValue': 'Copenhagen',
    'spec.expLabel': 'Experience',
    'spec.expValue': 'Since 2017',
    'spec.eduLabel': 'Education',
    'spec.eduValue': 'Sonic College (2014–2018)',
    'spec.softwareLabel': 'Software',
    'section.heading': 'Previous projects',
    footer: '© 2026 Jonas Krogh — Sound Design & Composition',
    countSuffix: 'projects'
  }
};

let currentLang = 'da';

function applyLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key] !== undefined) el.textContent = translations[lang][key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if (translations[lang][key] !== undefined) el.innerHTML = translations[lang][key];
  });

  document.getElementById('lang-da').setAttribute('aria-pressed', String(lang === 'da'));
  document.getElementById('lang-en').setAttribute('aria-pressed', String(lang === 'en'));

  const backLink = document.getElementById('back-link');
  if (backLink) backLink.href = lang === 'en' ? 'index.html?lang=en' : 'index.html';

  renderTimeline();
}

document.getElementById('lang-da').addEventListener('click', () => applyLanguage('da'));
document.getElementById('lang-en').addEventListener('click', () => applyLanguage('en'));

/* Ret eller tilføj opgaver herunder. "tags" styrer prikkens
   farve og de små mærker: brug ["lyddesign"], ["lydteknik"],
   eller begge, alt efter hvad opgaven faktisk indebar.
   "roleEn" er den engelske oversættelse af "role" (samme princip
   for roller inde i "seasons"). Venue- og forestillingsnavne
   oversættes ikke — de er egennavne. */
const entries = [
  {
    venue: "Østerbro Teater", show: null,
    role: "Lydtekniker — flere roller pr. sæson, se opgaver nedenfor",
    roleEn: "Sound engineer — multiple roles per season, see tasks below",
    date: "Jan 2020 – Juni 2026", dateEn: "Jan 2020 – June 2026", tags: ["lydteknik", "lyddesign"],
    seasons: [
      { period: "2025–26", items: [
        { role: "Komponist og Lyddesigner", roleEn: "Composer and Sound Designer", show: "CRIP" },
        { role: "Tonemester", roleEn: "Sound Mixer", show: "Fuglene" },
        { role: "Tonemester", roleEn: "Sound Mixer", show: "Moby Dick" }
      ]},
      { period: "2024–25", items: [
        { role: "Lydtekniker", roleEn: "Sound Engineer", show: "Vi, de druknede" },
        { role: "Tonemester", roleEn: "Sound Mixer", show: "Fuglene" },
        { role: "Tonemester", roleEn: "Sound Mixer", show: "Appollonian Circles" },
        { role: "Tonemester", roleEn: "Sound Mixer", show: "Pow-Pow-Pow" },
        { role: "Tonemester", roleEn: "Sound Mixer", show: "Anna Karenina" }
      ]},
      { period: "2023–24", items: [
        { role: "Komponist og Lyddesigner", roleEn: "Composer and Sound Designer", show: "Dagene, dagene, dagene" },
        { role: "Lydtekniker", roleEn: "Sound Engineer", show: "Grimm" },
        { role: "Teknisk afvikler", roleEn: "Technical Operator", show: "En lykkelig slutning" },
        { role: "Lydtekniker", roleEn: "Sound Engineer", show: "Er det nok nu?" }
      ]},
      { period: "2022–23", items: [
        { role: "Lydtekniker og Teknisk afvikling", roleEn: "Sound Engineer and Technical Operation", show: "Hair" },
        { role: "Lydtekniker og Teknisk afvikling", roleEn: "Sound Engineer and Technical Operation", show: "Gasolin" }
      ]}
    ]
  },
  { venue: "Teater Sort/Hvid", show: "Pigedyr", role: "Lyddesigner", roleEn: "Sound Designer", date: "Aug 2023 – Sep 2023", tags: ["lyddesign"] },
  { venue: "Augmented Hearing", show: null, role: "Lydteknisk Konsulent", roleEn: "Sound Engineering Consultant", date: "Maj 2022 – Juni 2022", dateEn: "May 2022 – June 2022", tags: ["lydteknik"] },
  { venue: "Paolo Nani Teater", show: "Fridas Store Rejse", role: "Lyddesigner", roleEn: "Sound Designer", date: "Marts 2022 – Juli 2022", dateEn: "March 2022 – July 2022", tags: ["lyddesign"] },
  { venue: "MYKA", show: "Natten (Tour)", role: "Tourne tekniker", roleEn: "Touring Technician", date: "Sep 2019 – 2023", tags: ["lydteknik"] },
  { venue: "Teater Sort/Hvid", show: "Electronic", role: "Lydtekniker/Lyddesigner", roleEn: "Sound Engineer/Sound Designer", date: "Okt – Dec 2019", dateEn: "Oct – Dec 2019", tags: ["lydteknik", "lyddesign"] },
  { venue: "Østerbro Teater", show: "Brøgger", role: "Lydtekniker", roleEn: "Sound Engineer", date: "Aug – Okt 2019", dateEn: "Aug – Oct 2019", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "Rocky", role: "Lydtekniker", roleEn: "Sound Engineer", date: "Maj 2019", dateEn: "May 2019", tags: ["lydteknik"] },
  { venue: "Livingstones Kabinet", show: "RANDOM (Tour)", role: "Lydtekniker", roleEn: "Sound Engineer", date: "Marts – April 2019", dateEn: "March – April 2019", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "Hvis dette er et menneske", role: "Lydtekniker", roleEn: "Sound Engineer", date: "Marts 2019", dateEn: "March 2019", tags: ["lydteknik"] },
  { venue: "Den Danske Scenekunstskole", show: "Afgang", role: "Lyddesigner", roleEn: "Sound Designer", date: "Feb – Marts 2019", dateEn: "Feb – March 2019", tags: ["lyddesign"] },
  { venue: "Østerbro Teater", show: "Dantes guddommelige Komedie", role: "Teknisk afvikler", roleEn: "Technical Operator", date: "Jan – Feb 2019", tags: ["lydteknik"] },
  { venue: "Teater Sort/Hvid", show: "Living Dead", role: "Teknisk afvikler", roleEn: "Technical Operator", date: "Okt – Dec 2018", dateEn: "Oct – Dec 2018", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "Richard III", role: "Lydtekniker/Q.lab koder", roleEn: "Sound Engineer/Q.lab Programmer", date: "Aug – Sep 2018", tags: ["lydteknik"] },
  { venue: "Liminal", show: "Fiaskomonologerne (the movie)", role: "Boomer + Noise Removal", roleEn: "Boomer + Noise Removal", date: "Maj – Juli 2018", dateEn: "May – July 2018", tags: ["lydteknik"] },
  { venue: "Sew Funk Fury Wit", show: "Crash", role: "Lyddesign/teknik & teknisk afvikler", roleEn: "Sound Design/Engineering & Technical Operator", date: "Feb – Marts 2018", dateEn: "Feb – March 2018", tags: ["lyddesign", "lydteknik"] },
  { venue: "KoppelWrite", show: "Født igår", role: "Lydtekniker & mix", roleEn: "Sound Engineer & Mix", date: "Sep – Okt 2017", dateEn: "Sep – Oct 2017", tags: ["lydteknik"] },
  { venue: "Husets Teater", show: "STATUS", role: "Teknisk afvikler", roleEn: "Technical Operator", date: "April – Juni 2017", dateEn: "April – June 2017", tags: ["lydteknik"] },
  { venue: "Livingstones Kabinet", show: "RANDOM", role: "Praktikant/Lyddesigner", roleEn: "Intern/Sound Designer", date: "Jan 2017 – Marts 2017", dateEn: "Jan 2017 – March 2017", tags: ["lyddesign"] }
];

const timeline = document.getElementById('timeline');

/* Total antal opsætninger: alle linjer i "entries" tælles som 1,
   bortset fra Østerbro Teater-linjen, hvor hver sæsons enkelte
   opsætninger ("seasons[].items") tælles i stedet for linjen selv. */
const totalOpsaetninger = entries.reduce((sum, e) => {
  if (e.seasons) {
    return sum + e.seasons.reduce((s, season) => s + season.items.length, 0);
  }
  return sum + 1;
}, 0);

function renderTimeline() {
  document.getElementById('entry-count').textContent = totalOpsaetninger + " " + translations[currentLang].countSuffix;

  timeline.innerHTML = '';
  entries.forEach(e => {
    const row = document.createElement('div');
    row.className = 'entry';

    const titleHtml = e.show ? `${e.venue}: <em style="font-style:italic">${e.show}</em>` : e.venue;
    const role = (currentLang === 'en' && e.roleEn) ? e.roleEn : e.role;
    const date = (currentLang === 'en' && e.dateEn) ? e.dateEn : e.date;

    const seasonsHtml = e.seasons ? `
      <div class="seasons">
        ${e.seasons.map(s => s.items.map((it, idx) => `
          <div class="season-row${idx === 0 ? ' new-season' : ''}">
            <div class="period">${idx === 0 ? s.period : ''}</div>
            <div class="role">${(currentLang === 'en' && it.roleEn) ? it.roleEn : it.role}</div>
            <div class="show">${it.show}</div>
          </div>
        `).join('')).join('')}
      </div>
    ` : '';

    row.innerHTML = `
      <div class="date">${date}</div>
      <div class="dot-col"><div class="dot"></div></div>
      <div class="content">
        <h3>${titleHtml}</h3>
        <p class="venue">${role}</p>
        ${seasonsHtml}
      </div>
    `;
    timeline.appendChild(row);
  });
}

(function initLanguageFromURL() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('lang') === 'en') { applyLanguage('en'); return; }
  renderTimeline();
})();
</script>

</body>
</html>
