  * { box-sizing: border-box; }

  body {
    margin: 0;

  header.site-nav {
    position: sticky;

    border-bottom: 1px solid var(--line);
  }
  .site-nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
    padding-bottom: 18px;
    max-width: 780px;
  }
  .site-nav .mark {
    font-family: 'MetanaNext', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }
  .site-nav .mark em { color: #000000; font-style: normal; }
  .site-nav-right { display: flex; align-items: center; gap: 14px; }
  .back-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: var(--ink-soft);
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .back-link:hover, .back-link:focus-visible { color: var(--rust); border-color: var(--rust); }

  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border-left: 1px solid var(--line);
    padding-left: 14px;
  }
  .lang-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 3px 5px;
  }
  .lang-btn[aria-pressed="true"] { color: var(--rust); font-weight: 600; }
  .lang-btn:hover, .lang-btn:focus-visible { color: var(--rust); }

  .cv-hero { padding: 64px 0 40px; }
  .cv-hero .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rust);
    margin: 0 0 16px;
  }
  .cv-hero h1 {
    font-family: 'MetanaNext', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    margin: 0 0 20px;
    letter-spacing: 0.01em;
    color: #000000;
  }
  .cv-hero h1 em { font-style: normal; font-weight: 700; color: #000000; }

  .spec-line {
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 12px;
    column-gap: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    margin-bottom: 8px;
  }
  .spec-line span { padding: 0; }
  .spec-line b { display: block; color: var(--pine); font-weight: 500; margin-bottom: 2px; }

  section { padding: 48px 0 72px; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .section-head h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    margin: 0;
  }
  .section-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.76rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .timeline { position: relative; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 118px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--line);
  }

  .entry {
    display: grid;
    grid-template-columns: 100px 36px 1fr;
    gap: 0;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    align-items: start;
  }
  .entry:last-child { border-bottom: none; }

  .entry .date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.74rem;
    color: #000000;
    padding-top: 3px;
    line-height: 1.4;
  }
  .entry .dot-col {
    position: relative;
    display: flex;
    justify-content: center;
  }
  .entry .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-soft);
    margin-top: 7px;
  }

  .entry .content h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.12rem;
    margin: 0 0 3px;
    line-height: 1.3;
  }
  .entry .content .venue {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin: 0 0 8px;
  }

  .seasons {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .season-row {
    display: grid;
    grid-template-columns: 66px 150px 1fr;
    gap: 12px;
    padding: 5px 0;
    align-items: baseline;
  }
  .season-row.new-season {
    margin-top: 10px;
    padding-top: 11px;
    border-top: 1px solid var(--line);
  }
  .season-row:first-child { margin-top: 0; padding-top: 5px; border-top: none; }
  .season-row .period {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--pine);
    letter-spacing: 0.03em;
  }
  .season-row .role {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .season-row .show {
    font-size: 0.88rem;
    font-style: italic;
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .season-row { grid-template-columns: 44px 1fr; row-gap: 2px; }
    .season-row .show { grid-column: 2; }
  }

  .legend {
    display: flex;
    gap: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 28px;

  .legend span { display: flex; align-items: center; gap: 6px; }

  .legend .dot.lyddesign { background: var(--rust); }
  .legend .dot.lydteknik { background: var(--ochre); }

  footer {
    padding: 28px 0 40px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);

  @media (max-width: 640px) {
    .timeline::before { left: 60px; }
    .entry { grid-template-columns: 60px 24px 1fr; }

    .spec-line { grid-template-columns: 1fr; row-gap: 14px; }
  }

  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
</style>

function applyLanguage(lang) {

    if (translations[lang][key] !== undefined) el.textContent = translations[lang][key];

  document.getElementById('lang-en').setAttribute('aria-pressed', String(lang === 'en'));

  const backLink = document.getElementById('back-link');
  if (backLink) backLink.href = lang === 'en' ? 'index.html?lang=en' : 'index.html';

const timeline = document.getElementById('timeline');

/* Total antal opsætninger: alle linjer i "entries" tælles som 1,
   bortset fra Østerbro Teater-linjen, hvor hver sæsons enkelte
   opsætninger ("seasons[].items") tælles i stedet for linjen selv. */
const totalOpsaetninger = entries.reduce((sum, e) => {
  if (e.seasons) {
    return sum + e.seasons.reduce((s, season) => s + season.items.length, 0);
  }
  return sum + 1;
}, 0);

function renderTimeline() {
  document.getElementById('entry-count').textContent = totalOpsaetninger + " " + translations[currentLang].countSuffix;

  timeline.innerHTML = '';
  entries.forEach(e => {
    const row = document.createElement('div');
    row.className = 'entry';

    const titleHtml = e.show ? `${e.venue}: <em style="font-style:italic">${e.show}</em>` : e.venue;
    const role = (currentLang === 'en' && e.roleEn) ? e.roleEn : e.role;
    const date = (currentLang === 'en' && e.dateEn) ? e.dateEn : e.date;

    const seasonsHtml = e.seasons ? `
      <div class="seasons">
        ${e.seasons.map(s => s.items.map((it, idx) => `
          <div class="season-row${idx === 0 ? ' new-season' : ''}">
            <div class="period">${idx === 0 ? s.period : ''}</div>
            <div class="role">${(currentLang === 'en' && it.roleEn) ? it.roleEn : it.role}</div>
            <div class="show">${it.show}</div>
          </div>
        `).join('')).join('')}
      </div>
    ` : '';

    row.innerHTML = `
      <div class="date">${date}</div>
      <div class="dot-col"><div class="dot"></div></div>
      <div class="content">
        <h3>${titleHtml}</h3>
        <p class="venue">${role}</p>
        ${seasonsHtml}
      </div>
    `;
    timeline.appendChild(row);
  });
}

(function initLanguageFromURL() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('lang') === 'en') { applyLanguage('en'); return; }
  renderTimeline();
})();
